AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Next.js app backend with DynamoDB tables and Lambda

Parameters:
  InternalSecret:
    Type: String
    NoEcho: true
  SpotifyClientId:
    Type: String
    NoEcho: true
  SpotifyClientSecret:
    Type: String
    NoEcho: true
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ''
  TelegramChatId:
    Type: String
    Default: ''

Conditions:
  TelegramEnabled: !And
    - !Not [!Equals [!Ref TelegramBotToken, '']]
    - !Not [!Equals [!Ref TelegramChatId, '']]

Resources:
  NotificationClientLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/notifications/
      CompatibleRuntimes:
        - nodejs22.x

  NotificationFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TelegramNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tappytrackTelegramNotify
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/telegramNotify/
      Timeout: 5
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotificationFailureQueue.Arn

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tappyusers
      AttributeDefinitions:
        - AttributeName: userid
          AttributeType: S
      KeySchema:
        - AttributeName: userid
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tappydevices
      AttributeDefinitions:
        - AttributeName: deviceid
          AttributeType: S
      KeySchema:
        - AttributeName: deviceid
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tappycards
      AttributeDefinitions:
        - AttributeName: userid
          AttributeType: S
        - AttributeName: cardID
          AttributeType: S
      KeySchema:
        - AttributeName: userid
          KeyType: HASH
        - AttributeName: cardID
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  GetUserCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getUserCards
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/getUserCards/
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: tappycards
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          CARDS_TABLE: tappycards
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
      Events:
        Api:
          Type: Api
          Properties:
            Path: /cards
            Method: get

  DeleteCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deleteCard
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/deleteCard/
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: tappycards
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          CARDS_TABLE: tappycards
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
      Events:
        Api:
          Type: Api
          Properties:
            Path: /cards
            Method: delete

  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: registerUser
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/registerUser/
      Layers:
        - !Ref NotificationClientLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
          NOTIFICATION_FUNCTION: !If [TelegramEnabled, !Ref TelegramNotifyFunction, '']
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users
            Method: post

  AddDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: addDevice
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/addDevice/
      Layers:
        - !Ref NotificationClientLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - DynamoDBCrudPolicy:
            TableName: tappyusers
        - DynamoDBCrudPolicy:
            TableName: tappydevices
      Environment:
        Variables:
          USERS_TABLE: tappyusers
          DEVICES_TABLE: tappydevices
          INTERNAL_SECRET: !Ref InternalSecret
          NOTIFICATION_FUNCTION: !If [TelegramEnabled, !Ref TelegramNotifyFunction, '']
      Events:
        Api:
          Type: Api
          Properties:
            Path: /devices
            Method: post

  AddCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: addCard
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/addCard/
      Layers:
        - !Ref NotificationClientLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - DynamoDBCrudPolicy:
            TableName: tappycards
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          CARDS_TABLE: tappycards
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          NOTIFICATION_FUNCTION: !If [TelegramEnabled, !Ref TelegramNotifyFunction, '']
      Events:
        Api:
          Type: Api
          Properties:
            Path: /cards
            Method: post

  TapCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tapCard
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/tapCard/
      Layers:
        - !Ref NotificationClientLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - LambdaInvokePolicy:
            FunctionName: !Ref TelegramNotifyFunction
        - DynamoDBCrudPolicy:
            TableName: tappycards
        - DynamoDBCrudPolicy:
            TableName: tappyusers
        - DynamoDBCrudPolicy:
            TableName: tappydevices
      Environment:
        Variables:
          CARDS_TABLE: tappycards
          USERS_TABLE: tappyusers
          DEVICES_TABLE: tappydevices
          INTERNAL_SECRET: !Ref InternalSecret
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          NOTIFICATION_FUNCTION: !If [TelegramEnabled, !Ref TelegramNotifyFunction, '']
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tap
            Method: post

  GetPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getPlayers
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/getPlayers/
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
      Events:
        Api:
          Type: Api
          Properties:
            Path: /players
            Method: get

  SetPlayerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: setPlayer
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: lambdas/setPlayer/
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: tappyusers
      Environment:
        Variables:
          USERS_TABLE: tappyusers
          INTERNAL_SECRET: !Ref InternalSecret
      Events:
        Api:
          Type: Api
          Properties:
            Path: /players
            Method: post
